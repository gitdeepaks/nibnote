name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  swift:
    name: SwiftLint + XCTest (native modules)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Detect native modules
        id: modules
        run: |
          if compgen -G "apps/ipad/modules/*/ios/*.swift" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No native modules; skipping."
          fi
      - name: SwiftLint
        if: steps.modules.outputs.present == 'true'
        run: |
          brew install swiftlint
          swiftlint lint --strict
      # Each module keeps its pure logic in a Core Swift package, so tests run on an iPad
      # simulator without building the React Native app.
      - name: XCTest (module Core packages on an iPad simulator)
        if: steps.modules.outputs.present == 'true'
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPad"))][0].udid')
          echo "Simulator: $UDID"
          for package in apps/ipad/modules/*/ios/Core/Package.swift; do
            dir=$(dirname "$package")
            echo "::group::$dir"
            (cd "$dir" && xcodebuild test -scheme "$(ls Sources)" -destination "id=$UDID")
            echo "::endgroup::"
          done
